  trusted-added: "&a{player} is now trusted in your base!"
  trusted-removed: "&c{player} is no longer trusted in your base."
  trusted-by-notification: "&aYou have been trusted by {owner}!"
  cant-trust-yourself: "&cYou can't trust yourself!"
  
  # List command
  trusted-players-header: "&bTrusted Players:"
  base-at-location: "&7  Base at {location}:"
  player-entry: "&f    - {name}"
  permissions-display: "&7      {permissions}"
  online-label: "&aOnline: "
  offline-label: "&e | Offline: "
  no-trusted-players: "&7  No trusted players yet."
  use-trust-command: "&7  Use &f/trust <player> &7to add someone."
  
  # Menu prompt
  add-player-prompt-header: "&6━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
