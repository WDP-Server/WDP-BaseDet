# ===========================================
# WDP-BaseDet Messages Configuration
# ===========================================
# Language version - for compatibility checking
# DO NOT EDIT unless you're updating translations
language-version: "1.0.0"

# Supports hex colors: &#RRGGBB
# Supports legacy colors: &a, &b, etc.
# Placeholders use: {key} format

prefix: "&8[&6BaseDet&8] &r"

# ===========================================
# COMMAND MESSAGES
# ===========================================
commands:
  # Console/player-only messages
  players-only: "&cThis command can only be used by players!"
  
  # Unknown command
  unknown-command: "&cUnknown command. Use /base help"
  
  # Permission denied
  no-permission: "&cYou don't have permission to do that!"
  
  # Player not found
  player-not-found: "&cPlayer not found: {player}"
  
  # No base
  no-base: "&cYou don't have a detected base yet!"
  no-confirmed-base: "&cYou don't have a confirmed base yet!"
  no-base-in-world: "&cYou don't have a confirmed base in this world!"
  
  # View command
  view-enabled: "&aBase visualization enabled. You can now see your base boundaries."
  view-disabled: "&eBase visualization disabled."
  no-bases-yet: "&7You don't have any confirmed bases yet."
  your-bases: "&bYour bases ({count}):"
  base-list-item: "&7  {number}. &f{location} &7({size})"
  
  # Detect command
  not-enough-activity: "&eNot enough activity detected yet. Keep building!"
  current-score: "&7  Current score: &f{score} &7/ {threshold}"
  analyzing-activity: "&bAnalyzing your activity..."
  not-enough-for-detection: "&cNot enough activity detected to determine a base location."
  
  # Score command
  detection-score-for: "&bDetection Score for {player}:"
  score-display: "&7  Score: &f{score} &7/ {threshold}"
  progress-display: "&7  Progress: {bar} &f{percentage}%"
  
  # Tool command
  selector-disabled: "&cThe selector tool is currently disabled!"
  
  # Expand command
  expand-usage: "&cUsage: /base expand <confirm|deny>"
  
  # Reload command
  config-reloaded: "&aConfiguration reloaded!"
  
  # Force command
  force-usage: "&cUsage: /base force <player>"
  force-triggered: "&aForced detection for {player}"
  
  # Info command
  info-usage: "&cUsage: /base info <player>"
  player-info: "&bPlayer Info: {player}"
  
  # Delete command
  delete-usage: "&cUsage: /base delete <player>"
  bases-deleted: "&aDeleted {count} bases for {player}"
  
  # Debug command
  debug-info: "&eDebug info:"
  debug-database: "&7  Database: {type}"
  debug-economy: "&7  Economy: {status}"
  debug-discord: "&7  DiscordSRV: {status}"
  debug-cmi: "&7  CMI: {status}"
  
  # List command
  all-bases-header: "&bAll Protected Bases ({count}):"
  all-bases-item: "&7  - &f{owner}&7: {location}"

# ===========================================
# HELP MENU
# ===========================================
help:
  header: "&6━━━ &bWDP-BaseDet Help &6━━━"
  user-commands-header: "&eUser Commands:"
  admin-commands-header: "&cAdmin Commands:"
  
  # User commands
  menu: "&f  /base menu &7- Open base management menu"
  confirm: "&f  /base confirm &7- Confirm a detected base"
  deny: "&f  /base deny &7- Deny a detected base"
  view: "&f  /base view &7- Toggle base visualization"
  detect: "&f  /base detect &7- Manually trigger detection"
  score: "&f  /base score &7- View your detection score"
  tool: "&f  /base tool &7- Get base selector tool"
  trust: "&f  /trust &7- Manage trusted players"
  
  # Admin commands
  reload: "&f  /base reload &7- Reload configuration"
  debug: "&f  /base debug &7- View debug info"
  force: "&f  /base force <player> &7- Force detection"
  info: "&f  /base info <player> &7- View player info"
  list: "&f  /base list &7- List all bases"
  delete: "&f  /base delete <player> &7- Delete player's bases"

# ===========================================
# DETECTION MESSAGES
# ===========================================
detection:
  # Detection prompt
  base-detected: "&a⬢ Base Detected!"
  location-info: "&7  Location: &f{location}"
  size-info: "&7  Size: &f{size} blocks"
  auto-confirm-timer: "&7  Auto-confirms in {minutes} minutes"
  auto-confirm-warning: "&eBase will auto-confirm in {time}"
  
  # No pending detection
  no-pending-detection: "&cYou don't have a pending base detection!"
  
  # Confirm messages
  base-confirmed: "&a✓ Base {type}!"
  base-confirmed-manual: "confirmed"
  base-confirmed-auto: "auto-confirmed"
  size-confirmed: "&7  Size: &f{dimensions} &7(&6{volume} &7blocks)"
  protection-info: "&7  Your base is now protected when you're offline."
  trust-info: "&7  Use &f/trust &7to manage trusted players."
  
  # Reward messages
  reward-confirm: "&aYou received &6{amount} SkillCoins &afor confirming your base!"
  reward-auto-confirm: "&aYou received &6{amount} SkillCoins &afor auto-confirming your base!"
  reward-deny: "&aYou received &6{amount} SkillCoins &afor responding to the detection prompt."
  
  # Deny message
  base-denied: "&eBase detection cancelled. Keep building!"
  
  # Pending detection reminder (on join)
  pending-detection-reminder: "&eYou have a pending base detection! Use &f/basedet confirm &eor &f/basedet deny"
  
  # Too close to existing base
  too-close-to-base: "&eThis location is too close to one of your existing bases."
  
  # Old base abandoned
  old-base-abandoned: "&eYour oldest base has been abandoned to make room for this one."

# ===========================================
# EXPANSION MESSAGES
# ===========================================
expansion:
  # Expansion detected
  expansion-detected: "&e⬢ Base Expansion Detected!"
  blocks-grown: "&7  Your base has grown by &f{count} blocks"
  new-size: "&7  New size: &f{dimensions}"
  
  # Confirm expansion
  expansion-confirmed: "&a✓ Base Expanded!"
  old-size: "&7  Old size: &f{dimensions} &7(&6{volume} &7blocks)"
  new-size-detailed: "&7  New size: &a{dimensions} &7(&a{volume} &7blocks)"
  blocks-added: "&7  Added: &a+{count} &7blocks"
  expansion-reward: "&aYou received &6{amount} SkillCoins &afor confirming the expansion!"
  
  # Deny expansion
  expansion-denied: "&eExpansion cancelled. Your base size remains unchanged."
  expansion-expired: "&eExpansion prompt expired. Your base size remains unchanged."
  
  # No pending expansion
  no-pending-expansion: "&cNo pending expansion to confirm."
  no-expansion-to-deny: "&cNo pending expansion to deny."

# ===========================================
# TRUST MESSAGES
# ===========================================
