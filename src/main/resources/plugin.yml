name: WDP-BaseDet
version: ${project.version}
main: com.wdp.basedet.WDPBaseDetPlugin
api-version: '1.21'
description: Automatic base detection and protection system
author: WDP Team

softdepend:
  - Vault
  - DiscordSRV
  - CMI
  - AuraSkills
  - PlaceholderAPI

commands:
  base:
    description: Base detection main command
    aliases: [bd, basedet]
    usage: /<command> <subcommand>
  
  trust:
    description: Trust a player in your base
    usage: /trust [player]
    
permissions:
  basedet.admin:
    description: Admin permissions for base detection
    default: op
    children:
      basedet.admin.reload: true
      basedet.admin.debug: true
      basedet.admin.bypass: true
      basedet.admin.view: true
      basedet.admin.force: true
      
  basedet.admin.reload:
    description: Reload the plugin configuration
    default: op
    
  basedet.admin.debug:
    description: Toggle debug mode
    default: op
    
  basedet.admin.bypass:
    description: Bypass all base protection
    default: op
    children:
      basedet.bypass.break: true
      basedet.bypass.place: true
      basedet.bypass.container: true
      basedet.bypass.door: true
      basedet.bypass.redstone: true
      basedet.bypass.entity: true
      basedet.bypass.vehicle: true
      basedet.bypass.decoration: true
      basedet.bypass.combat: true
      basedet.bypass.teleport: true
      
  basedet.bypass.break:
    description: Bypass break block protection
    default: op
    
  basedet.bypass.place:
    description: Bypass place block protection
    default: op
    
  basedet.bypass.container:
    description: Bypass container protection
    default: op
    
  basedet.bypass.door:
    description: Bypass door/gate protection
    default: op
    
  basedet.bypass.redstone:
    description: Bypass redstone protection
    default: op
    
  basedet.bypass.entity:
    description: Bypass entity damage protection
    default: op
    
  basedet.bypass.vehicle:
    description: Bypass vehicle protection
    default: op
    
  basedet.bypass.decoration:
    description: Bypass decoration protection
    default: op
    
  basedet.bypass.combat:
    description: Bypass combat restrictions in bases
    default: op
    
  basedet.bypass.teleport:
    description: Bypass teleport cooldowns and restrictions
    default: op
    
  basedet.admin.view:
    description: View any player's base
    default: op
    
  basedet.admin.force:
    description: Force detection on a player
    default: op
    
  basedet.user:
    description: Basic user permissions
    default: true
    children:
      basedet.user.claim: true
      basedet.user.trust: true
      basedet.user.view: true
      basedet.user.detect: true
      basedet.user.tool: true
      basedet.user.menu: true
      basedet.user.teleport: true
      
  basedet.user.claim:
    description: Claim a detected base
    default: true
    
  basedet.user.trust:
    description: Trust players in your base
    default: true
    
  basedet.user.view:
    description: View your own base
    default: true
    
  basedet.user.detect:
    description: Manually trigger base detection
    default: true
    
  basedet.user.tool:
    description: Use the selector tool
    default: true
    
  basedet.user.menu:
    description: Open the base management menu
    default: true
  
  basedet.user.teleport:
    description: Teleport to your base
    default: true
